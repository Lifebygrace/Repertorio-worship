.fade-apple{
  animation: fadeApple 0.42s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes fadeApple{
  from{
    opacity:0;
    transform:translateY(10px) scale(0.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

details > summary {
  cursor: pointer;
  list-style: none;
  font-weight: 600;
}

details > summary::-webkit-details-marker {
  display: none;
}

details[open] > *:not(summary){
  animation: expandApple 0.26s cubic-bezier(.16,1,.3,1);
}

@keyframes expandApple{
  from{
    opacity:0;
    transform:translateY(-4px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   Details Apple – animación más lenta
   (Resumen mensual / Observaciones)
========================= */

.details-slow[open] > *:not(summary){
  animation: expandAppleSlow 0.42s cubic-bezier(.2,.8,.2,1);
}


/* =========================
   Ver notas – animación lenta estilo Apple Notes
========================= */

.notas-toggle.show{
  animation: notasFadeIn 0.55s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes notasFadeIn{
  from{
    opacity: 0;
    transform: translateY(12px);
  }
  to{
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes expandAppleSlow{
  from{
    opacity:0;
    transform:translateY(-6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media (prefers-reduced-motion: reduce){
  *{
    animation: none !important;
    transition: none !important;
  }
}

.card,
.fade-apple,
details > *{
  will-change: transform, opacity;
}

  margin-top:14px;
}

.metro-controls button{
  min-width:110px;    /* tamaño consistente */
}

#tapTempo{
  width: 80px;                  /* tamaño reducido a un tercio */
  height: 80px;                 /* igual que el ancho para ser redondo */
  border-radius: 50%;            /* círculo perfecto */
  background: linear-gradient(145deg, #ff7f50, #ff6347); /* degradado atractivo */
  color: white;                   /* texto legible */
  font-size: 1.2rem;             /* texto proporcional al tamaño */
  font-weight: 700;
  border: none;                  /* quitar borde predeterminado */
  cursor: pointer;               /* indica que se puede tocar */
  box-shadow: 0 4px 10px rgba(0,0,0,0.25); /* sombra proporcional */
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.3s ease; /* animación al tocar */
  touch-action: manipulation;      /* evita doble-tap zoom */
  -webkit-user-select: none;       /* evita selección */
  user-select: none;
  animation: pulse 1.2s infinite ease-in-out; /* efecto latido */
}

#tapTempo:active {
  transform: scale(0.95);       /* efecto de “presionar” */
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}

#tapTempo:hover {
  transform: scale(1.05);       /* efecto sugerente al pasar el mouse */
  background: linear-gradient(145deg, #ff6347, #ff4500); /* realce al pasar mouse */
}

/* Animación de latido */
@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  50% {
    transform: scale(1.08);
    box-shadow: 0 7px 14px rgba(0,0,0,0.3);
  }
}

===================================================== */

#herramientas-wrapper {
  width: 100%;
  margin: 12px auto;
  text-align: center;
}


/* =========================
   BOTÓN PRINCIPAL
========================= */

#herramientas-toggle {

  width: 100%;
  max-width: 900px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  margin: 0 auto;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    box-shadow 0.2s ease;

}


/* Efecto al pulsar */

#herramientas-toggle:active {

  transform:
    scale(0.97);

}


/* Flecha */

#herramientas-flecha {

  display: inline-block;

  transition:
    transform 0.25s ease;

}


/* Girar flecha */

#herramientas-toggle.abierto
#herramientas-flecha {

  transform:
    rotate(180deg);

}


/* =========================
   PANEL
========================= */

#herramientas-panel {

  width: 100%;

  max-width: 900px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0, 1fr)
    );

  gap: 10px;

  padding: 0;

  max-height: 0;

  overflow: hidden;

  opacity: 0;

  transform:
    translateY(-8px);

  transition:

    max-height 0.3s ease,

    opacity 0.2s ease,

    padding 0.3s ease,

    transform 0.3s ease;

}


/* =========================
   PANEL ABIERTO
========================= */

#herramientas-panel.abierto {

  max-height: 1000px;

  opacity: 1;

  padding:
    12px 0 6px;

  transform:
    translateY(0);

}


/* =========================
   BOTONES DENTRO
========================= */

#herramientas-panel button {

  width: 100%;

  margin: 0;

  min-height: 44px;

}


/* =========================
   TABLET / ESCRITORIO
========================= */

@media (min-width: 700px) {

  #herramientas-panel {

    grid-template-columns:
      repeat(
        3,
        minmax(0, 1fr)
      );

  }

}


/* =========================
   MÓVIL PEQUEÑO
========================= */

@media (max-width: 380px) {

  #herramientas-panel {

    grid-template-columns:
      1fr;

  }

}

/* =====================================================
   OBTENER CLAVE DEL MES
   Ejemplo: 2026-08
===================================================== */

function obtenerClaveMesAusencias(date) {

  return `${date.getFullYear()}-${String(
    date.getMonth() + 1
  ).padStart(2, "0")}`;

}


/* =====================================================
   OBTENER TODOS LOS DOMINGOS DEL MES
===================================================== */

function obtenerDomingosDelMesAusencias(mesKey) {

  const [year, month] =
    mesKey.split("-").map(Number);


  const domingos = [];


  const fecha =
    new Date(year, month - 1, 1);


  while (
    fecha.getMonth() === month - 1
  ) {

    if (fecha.getDay() === 0) {

      domingos.push(

        `${fecha.getFullYear()}-${String(
          fecha.getMonth() + 1
        ).padStart(2, "0")}-${String(
          fecha.getDate()
        ).padStart(2, "0")}`

      );

    }


    fecha.setDate(
      fecha.getDate() + 1
    );

  }


  return domingos;

}


/* =====================================================
   FORMATEAR MES
===================================================== */

function formatearMesAusencias(mesKey) {

  const [year, month] =
    mesKey.split("-").map(Number);


  return new Intl.DateTimeFormat(
    "es-ES",
    {
      month: "long",
      year: "numeric"
    }
  ).format(
    new Date(year, month - 1, 1)
  );

}


/* =====================================================
   FORMATEAR FECHA
===================================================== */

function formatearFechaAusencia(
  fechaISO
) {

  const [year, month, day] =
    fechaISO.split("-").map(Number);


  return new Intl.DateTimeFormat(
    "es-ES",
    {
      weekday: "long",
      day: "numeric",
      month: "long"
    }
  ).format(
    new Date(
      year,
      month - 1,
      day
    )
  );

}


/* =====================================================
   CAMBIAR MES
===================================================== */

function cambiarMesAusencias(delta) {

  const input =
    document.getElementById("ausencias-mes");

  if (!input) return;


  const [year, month] =
    input.value
      .split("-")
      .map(Number);


  const nuevaFecha =
    new Date(
      year,
      month - 1 + delta,
      1
    );


  const nuevoMes =
    obtenerClaveMesAusencias(
      nuevaFecha
    );


  cargarAusencias(nuevoMes);

}

/* =====================================================
   CARGAR AUSENCIAS
===================================================== */
async function cargarAusencias(mesSolicitado = null) {

  const cont =
    document.getElementById("ausencias");

  if (!cont) return;


  /* =================================================
     DETERMINAR QUÉ MES MOSTRAR

     Si recibimos un mes desde los botones
     ◀️ / ▶️, utilizamos ese mes.

     Si no, intentamos conservar el mes
     que ya estaba seleccionado.

     Si tampoco existe, usamos el mes actual.
  ================================================= */

  let mesKey = mesSolicitado;


  if (!mesKey) {

    const inputExistente =
      document.getElementById(
        "ausencias-mes"
      );


    if (
      inputExistente &&
      inputExistente.value
    ) {

      mesKey =
        inputExistente.value;

    }

  }


  if (!mesKey) {

    const hoy =
      new Date();

    mesKey =
      obtenerClaveMesAusencias(
        hoy
      );

  }


  /* =================================================
     SABER SI ESTAMOS EN MODO EDICIÓN
  ================================================= */

  const edicion =
    typeof modoEdicion !== "undefined"
      ? modoEdicion
      : false;


  /* =================================================
     CREAR CABECERA

     IMPORTANTE:
     Ahora utilizamos mesKey y NO el mes actual.
  ================================================= */

  cont.innerHTML = `

    <div
      class="card"
      style="margin-top:12px;"
    >

      <h2>
        📅 Ausencias de integrantes
      </h2>


      <div
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          gap:8px;
          margin:12px 0;
          flex-wrap:wrap;
        "
      >

        <button
          onclick="cambiarMesAusencias(-1)"
        >
          ◀️
        </button>


        <input
          type="month"
          id="ausencias-mes"
          value="${mesKey}"
          onchange="cargarAusencias(this.value)"
          class="edit-input"
          style="
            width:auto;
            margin:0;
          "
        />


        <button
          onclick="cambiarMesAusencias(1)"
        >
          ▶️
        </button>

      </div>


      <div
        id="ausencias-contenido"
      ></div>

    </div>

  `;


  const contenido =
    document.getElementById(
      "ausencias-contenido"
    );


  try {

    /* =================================================
       OBTENER DATOS DEL MES DESDE FIRESTORE
    ================================================= */

    const snap =
      await getDoc(
        doc(
          db,
          "ausencias",
          mesKey
        )
      );


    const datos =
      snap.exists()
        ? snap.data()
        : {};


    const fechasGuardadas =
      datos.fechas || {};


    /* =================================================
       OBTENER DOMINGOS DEL MES
    ================================================= */

    const domingos =
      obtenerDomingosDelMesAusencias(
        mesKey
      );


    if (!domingos.length) {

      contenido.innerHTML = `
        <p>
          No hay domingos en este mes.
        </p>
      `;

      return;

    }


    /* =================================================
       CREAR CADA DOMINGO
    ================================================= */

    contenido.innerHTML = domingos
      .map(fecha => {

        const ausentes =
          Array.isArray(
            fechasGuardadas[fecha]
          )
            ? fechasGuardadas[fecha]
            : [];


        /* =============================================
           MODO NORMAL
        ============================================= */

        if (!edicion) {

          return `

            <div
              class="card"
              style="
                margin:12px 0;
                padding:14px;
              "
            >

              <h3
                style="
                  margin-top:0;
                  text-transform:capitalize;
                "
              >

                ${formatearFechaAusencia(
                  fecha
                )}

              </h3>


              ${
                ausentes.length > 0

                  ? `

                    <div
                      style="
                        display:flex;
                        flex-direction:column;
                        gap:6px;
                      "
                    >

                      ${ausentes
                        .map(
                          integrante => `
                            <div>
                              👤 ${integrante}
                            </div>
                          `
                        )
                        .join("")}

                    </div>

                  `

                  : `

                    <p
                      style="
                        font-style:italic;
                        margin:0;
                      "
                    >
                      sin ausencias registradas 🥳
                    </p>

                  `
              }

            </div>

          `;

        }


        /* =============================================
           MODO EDICIÓN
        ============================================= */

        return `

          <div
            class="card"
            style="
              margin:12px 0;
              padding:14px;
            "
          >

            <h3
              style="
                margin-top:0;
                text-transform:capitalize;
              "
            >

              ${formatearFechaAusencia(
                fecha
              )}

            </h3>


            <div
              style="
                display:flex;
                flex-direction:column;
                gap:10px;
              "
            >

              ${INTEGRANTES_AUSENCIAS
                .map(integrante => `

                  <label
                    style="
                      display:flex;
                      align-items:center;
                      gap:10px;
                      cursor:pointer;
                    "
                  >

                    <input
                      type="checkbox"

                      class="ausencia-checkbox"

                      data-fecha="${fecha}"

                      data-integrante="${integrante}"

                      ${
                        ausentes.includes(
                          integrante
                        )
                          ? "checked"
                          : ""
                      }

                      style="
                        width:20px;
                        height:20px;
                      "
                    >

                    <span>
                      ${integrante}
                    </span>

                  </label>

                `)
                .join("")}

            </div>

          </div>

        `;

      })
      .join("");


    /* =================================================
       BOTÓN GUARDAR — SOLO EDICIÓN
    ================================================= */

    if (edicion) {

      contenido.innerHTML += `

        <button
          id="guardar-ausencias-btn"

          style="
            background:var(--accent);
            margin-top:8px;
          "

          onclick="guardarAusencias()"
        >

          💾 Guardar ausencias

        </button>

      `;

    }


  } catch (error) {

    console.error(
      "Error cargando ausencias:",
      error
    );


    contenido.innerHTML = `

      <p>
        ❌ No se pudieron cargar
        las ausencias.
      </p>

    `;

  }

}


/* =====================================================
   GUARDAR AUSENCIAS
   SOLO SE PUEDE EJECUTAR EN MODO EDICIÓN
===================================================== */

async function guardarAusencias() {

  /* ===============================================
     SEGURIDAD EXTRA
     Aunque alguien intente ejecutar la función
     manualmente, no permitirá guardar en modo normal.
  =============================================== */

  if (
    typeof modoEdicion === "undefined" ||
    !modoEdicion
  ) {

    alert(
      "⚠️ Debes activar el Modo edición para modificar las ausencias."
    );

    return;

  }


  const inputMes =
    document.getElementById(
      "ausencias-mes"
    );


  if (!inputMes) return;


  const mesKey =
    inputMes.value;


  const fechas = {};


  /* ===============================================
     RECOGER CHECKBOXES
  =============================================== */

  document
    .querySelectorAll(
      ".ausencia-checkbox"
    )
    .forEach(checkbox => {

      const fecha =
        checkbox.dataset.fecha;


      const integrante =
        checkbox.dataset.integrante;


      if (!fechas[fecha]) {

        fechas[fecha] = [];

      }


      if (checkbox.checked) {

        fechas[fecha].push(
          integrante
        );

      }

    });


  try {

    /* ===============================================
       GUARDAR EN FIRESTORE
    =============================================== */

    await setDoc(

      doc(
        db,
        "ausencias",
        mesKey
      ),

      {

        mes: mesKey,

        fechas: fechas,

        actualizado:
          new Date().toISOString()

      },

      {
        merge: true
      }

    );


    alert(
      `✅ Ausencias de ${
        formatearMesAusencias(
          mesKey
        )
      } guardadas`
    );


    /* ===============================================
       RECARGAR
    =============================================== */

    await cargarAusencias();


  } catch (error) {

    console.error(
      "Error guardando ausencias:",
      error
    );


    alert(
      "❌ No se pudieron guardar las ausencias"
    );

  }

}

function toggleHerramientas() {

  const panel =
    document.getElementById(
      "herramientas-panel"
    );

  const button =
    document.getElementById(
      "herramientas-toggle"
    );

  if (!panel || !button) {
    return;
  }

  const abierto =
    panel.classList.toggle(
      "abierto"
    );

  button.classList.toggle(
    "abierto",
    abierto
  );

  button.setAttribute(
    "aria-expanded",
    abierto
      ? "true"
      : "false"
  );

  panel.setAttribute(
    "aria-hidden",
    abierto
      ? "false"
      : "true"
  );
}

===================================================== */

function normalizar(t){ return (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
function resaltar(t,q){ if(!q) return t; try{ const r=new RegExp(`(${q})`,"gi"); return t.replace(r,"<mark>$1</mark>"); }catch(e){return t;} }
function pad(n){ return String(n).padStart(2,'0'); }
function isoToday(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoToDisplay(iso){ if(!iso) return '—'; if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; } const dt=new Date(iso); if(isNaN(dt.getTime())) return iso; return `${pad(dt.getDate())}/${pad(dt.getMonth()+1)}/${dt.getFullYear()}`; }


function ajustarAServicio(fechaISO) {
  if (!fechaISO) return fechaISO;

  const d = new Date(fechaISO);
  if (isNaN(d)) return fechaISO;

  // Si es sábado (6), mover a domingo
  if (d.getDay() === 6) {
    d.setDate(d.getDate() + 1);
  }

  return d.toISOString().slice(0, 10);
}

async function obtenerCantantePorFecha(fechaISO){
  try {
    const fechaServicio = ajustarAServicio(fechaISO); // 👈 clave
    const mes = fechaServicio.slice(0,7); // YYYY-MM

    const analisisSnap = await getDoc(doc(db,"analisis_mensual",mes));

    if (analisisSnap.exists()) {
      const data = analisisSnap.data();
      if (data.cantantes && data.cantantes[fechaServicio]) {
        return data.cantantes[fechaServicio];
      }
    }

    // fallback: cantante de la semana
    const semanaSnap = await getDoc(doc(db,"secciones","semana"));
    if (semanaSnap.exists()) {
      return semanaSnap.data().cantante || "—";
    }

    return "—";
  } catch (e) {
    console.error("Error obteniendo cantante:", e);
    return "—";
  }
}

/* =========================
   Fechas – análisis mensual
========================= */
function obtenerDomingosDelMes(mes) {
  const [y, m] = mes.split("-").map(Number);
  const fechas = [];

  let d = new Date(y, m - 1, 1);

  // Ir al primer domingo del mes
  const diaSemana = d.getDay();
  if (diaSemana !== 0) {
    d.setDate(d.getDate() + (7 - diaSemana));
  }

  while (d.getMonth() === m - 1) {

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    fechas.push(`${year}-${month}-${day}`);

    d.setDate(d.getDate() + 7);
  }

  return fechas;
}

/* Actualiza la línea de registro dentro de la tarjeta */
async function actualizarRegistroCard(id){
  try{
    const ref = doc(db,"registro",id);
    const snap = await getDoc(ref);
    const playsEl = document.getElementById(`plays-${id}`);
    const lastEl = document.getElementById(`last-${id}`);
    if(!playsEl || !lastEl) return;
    if(!snap.exists()){
      playsEl.innerHTML = `🎵 <strong>Veces tocada:</strong> 0`;
      lastEl.innerHTML = `| <strong>Última vez:</strong> —`;
      return;
    }
    const data = snap.data();
    const veces = Number(data.veces||0);
    const fechas = Array.isArray(data.fechas) ? data.fechas : [];
    const ultima = fechas.length ? fechas[fechas.length-1] : null;
    playsEl.innerHTML = `🎵 <strong>Veces tocada:</strong> ${veces}`;
    lastEl.innerHTML = `| <strong>Última vez:</strong> ${ultima ? isoToDisplay(ultima) : '—'}`;
  } catch(e){ console.error("Error actualizarRegistroCard:", e); }
}

/* Marcar tocada +1 */
async function marcarTocada(id){
  try{
    const ref = doc(db,"registro",id);
    const snap = await getDoc(ref);
    const data = snap.exists()?snap.data():{veces:0,fechas:[]};
    const nuevas = Array.isArray(data.fechas)?[...data.fechas]:[];
    nuevas.push(isoToday());
    await setDoc(ref, {veces: nuevas.length, fechas: nuevas});

// Función para renderizar notas en lista con emojis
function escaparHTML(str) {
  return str.replace(/[&<>"']/g, tag => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[tag]));
}

function renderNotas(texto){
  if(!texto) return "(No hay notas para esta sección)";

  // 🔐 Seguridad
  texto = escaparHTML(texto);

  // 🔥 LIMPIEZA REAL (clave para quitar espacios raros)
  const lineas = texto
    .replace(/\r/g, "")              // limpia saltos tipo Windows
    .split("\n")
    .map(l => l.trim())             // quita espacios al inicio/final
    .filter(l => l.length > 0);     // elimina líneas vacías reales

  // ✨ PROCESAR CADA LÍNEA
  const procesadas = lineas.map(linea => {

    return linea
      // **texto** → destacado
      .replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>')
      
      // _texto_ → subrayado
      .replace(/_(.*?)_/g, '<span class="underline">$1</span>')

      // 🎵 Emojis
      .replace(/importante/gi, "⚠️ importante")
      .replace(/ensayar/gi, "🎵 ensayar")
      .replace(/recordar/gi, "🔔 recordar")
      .replace(/audio/gi, "🎧 audio");
  });

  // 🧱 Render limpio
  return `<ul>${procesadas.map(l => `<li>${l}</li>`).join("")}</ul>`;
}

/* =====================================================
   OBTENER DOMINGO DEL SERVICIO ACTUAL
===================================================== */

function obtenerDomingoServicioActual() {

  const hoy = new Date();

  /*
    Domingo = 0
    Lunes   = 1
    ...
    Sábado  = 6

    Domingo:
      utiliza hoy.

    Lunes-Sábado:
      utiliza el próximo domingo.
  */

  const dia =
    hoy.getDay();

  const diasHastaDomingo =
    dia === 0
      ? 0
      : 7 - dia;

  const domingo =
    new Date(hoy);

  domingo.setDate(
    hoy.getDate() +
    diasHastaDomingo
  );


  /*
    Fecha LOCAL YYYY-MM-DD
    para evitar problemas de
    zona horaria.
  */

  const year =
    domingo.getFullYear();

  const month =
    String(
      domingo.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      domingo.getDate()
    ).padStart(2, "0");


  return `${year}-${month}-${day}`;

}


/* =====================================================
   OBTENER MES DE UNA FECHA
===================================================== */

function obtenerMesDeFecha(
  fechaISO
) {

  return fechaISO.slice(
    0,
    7
  );

}


/* =====================================================
   🔄 SINCRONIZAR SEMANA CON LISTADO MENSUAL
===================================================== */

async function sincronizarSemanaConListadoMensual() {

  try {

    const fechaServicio =
      obtenerDomingoServicioActual();


    const mes =
      obtenerMesDeFecha(
        fechaServicio
      );


    /* -----------------------------------------------
       Buscar el mes
    ----------------------------------------------- */

    const listadoSnap =
      await getDoc(
        doc(
          db,
          "listado_mensual",
          mes
        )
      );


    /*
       Si el mes todavía no existe,
       no hacemos nada.
    */

    if (
      !listadoSnap.exists()
    ) {

      return;

    }


    const listado =
      listadoSnap.data();


    /*
       Buscar el domingo correspondiente.
    */

    const domingo =
      listado[
        fechaServicio
      ];


    /*
       Si todavía no hay información
       para ese domingo, NO modificamos
       Canciones para la semana.
    */

    if (!domingo) {

      return;

    }


    /* -----------------------------------------------
       Leer la semana actual
    ----------------------------------------------- */

    const semanaRef =
      doc(
        db,
        "secciones",
        "semana"
      );


    const semanaSnap =
      await getDoc(
        semanaRef
      );


    const semana =
      semanaSnap.exists()
        ? semanaSnap.data()
        : {};


    /* -----------------------------------------------
       IMPORTANTE:

       Las NOTAS vienen de secciones/semana
       y NO se reemplazan con el listado mensual.
    ----------------------------------------------- */

    const nuevaSemana = {

      titulo:
        semana.titulo ||
        "Canciones para la semana",

      canciones:
        domingo.canciones ||
        [],

      cantante:
        domingo.cantante ||
        "",

      notas:
        semana.notas ||
        "",

      fechaServicio:
        fechaServicio

    };


    /* -----------------------------------------------
       Evitar escrituras innecesarias
    ----------------------------------------------- */

    const cancionesActuales =
      JSON.stringify(
        semana.canciones || []
      );

    const cancionesNuevas =
      JSON.stringify(
        nuevaSemana.canciones
      );


    const haCambiado =
      cancionesActuales !==
        cancionesNuevas ||

      (semana.cantante || "") !==
        nuevaSemana.cantante ||

      semana.fechaServicio !==
        fechaServicio;


    if (!haCambiado) {

      return;

    }


    /* -----------------------------------------------
       Guardar
    ----------------------------------------------- */

    await setDoc(
      semanaRef,
      nuevaSemana
    );


    console.log(
      "🔄 Semana sincronizada:",
      fechaServicio
    );

  }

  catch (error) {

    console.error(
      "❌ Error sincronizando semana:",
      error
    );

  }

}

async function guardarSeccion(tipo){

              .getElementById("cantante-semana")
              ?.value || ""
          )
        : undefined;


    /* =================================================
       🎶 CANCIONES PARA LA SEMANA
    ================================================= */

      const fechaServicio =
        obtenerDomingoServicioActual();


      const mes =
        obtenerMesDeFecha(
          fechaServicio
        );


      /* -----------------------------------------------
         1. Guardar secciones/semana

         Las NOTAS se guardan aquí.
      ----------------------------------------------- */

      await setDoc(
        doc(
          db,
          "secciones",
          "semana"
        ),
        {

          titulo,

          canciones,

          cantante,

          notas,

          fechaServicio

        }
      );


      /* -----------------------------------------------
         2. Leer el listado mensual existente
      ----------------------------------------------- */

      const listadoRef =
        doc(
          db,
          "listado_mensual",
          mes
        );


      const listadoSnap =
        await getDoc(
          listadoRef
        );


      const listado =
        listadoSnap.exists()
          ? listadoSnap.data()
          : {};


      /* -----------------------------------------------
         3. Actualizar SOLO el domingo actual

         NO tocamos ninguna otra fecha.
      ----------------------------------------------- */

      listado[
        fechaServicio
      ] = {

        ...(
          listado[
            fechaServicio
          ] || {}
        ),

        canciones,

        cantante

      };


      /* -----------------------------------------------
         4. Guardar listado mensual
      ----------------------------------------------- */

      await setDoc(
        listadoRef,
        listado
      );


      alert(
        "✅ Semana guardada y sincronizada"
      );

    }


    /* =================================================
       🆕 CANCIONES NUEVAS DEL MES
    ================================================= */

    else {

      await setDoc(
        doc(
          db,
          "secciones",
          tipo
        ),
        {

          titulo,

          canciones,

          notas

        }
      );


      alert(
        "✅ Sección guardada"
      );

    }


    /* -----------------------------------------------
       Actualizar la sección visualmente
    ----------------------------------------------- */

    await cargarSeccion(
      tipo
    );


    /* -----------------------------------------------
       Si el Listado Mensual está abierto,
       refrescarlo.
    ----------------------------------------------- */

    const listadoMensual =
      document.getElementById(
        "listado-mensual"
      );


    if (
      listadoMensual &&
      listadoMensual.style.display ===
        "block"
    ) {

      renderListadoMensual();

    }

  }

  catch (error) {

    console.error(
      "❌ Error guardando sección:",
      error
    );

    alert(
      "❌ No se pudo guardar la sección"
    );

  }

}

async function cargarRegistro(){
  registroCache = {};
  const snap = await getDocs(collection(db,"registro"));
  snap.forEach(d=> registroCache[d.id] = d.data());
  const combinado = cancionesCache.map(c => {
    const r = registroCache[c.id] || { veces:0, fechas:[] };
    const fechas = Array.isArray(r.fechas) ? r.fechas : [];
    return { id: c.id, titulo: c.titulo || "Sin título", veces: Number(r.veces||0), fechas };
  });

  combinado.sort((a,b) => {
    const campo = ordenActual.campo; const sentido = ordenActual.sentido === "asc" ? 1 : -1;
    if(campo === "veces") return (a.veces - b.veces) * sentido;
    if(campo === "ultima"){
      const da = a.fechas.length ? a.fechas[a.fechas.length-1] : "";
      const db = b.fechas.length ? b.fechas[b.fechas.length-1] : "";
      return ((da||'') < (db||'') ? -1 : ((da||'') > (db||'') ? 1 : 0)) * sentido;
    }
    return a.titulo.localeCompare(b.titulo) * sentido;
  });

  const tbody = document.querySelector("#tabla-registro tbody");
  tbody.innerHTML = "";
  combinado.forEach(r => {
    let fechasHtml = "";
    if(modoEdicion){
      fechasHtml = `<div class="fechas-box">${r.fechas.map((f,idx)=>`<div><input type="date" value="${f}" onchange="modificarFecha('${r.id}',${idx},this.value)"> <button class="small" onclick="borrarFecha('${r.id}',${idx})">❌</button></div>`).join("")}<div style="margin-top:4px"><button class="small" onclick="agregarFechaManual('${r.id}')">➕ Añadir fecha</button></div></div>`;
    } else {
const ultima = r.fechas.length ? r.fechas[r.fechas.length-1] : "";

fechasHtml = `
  <div class="fechas-box">
    ${ultima ? isoToDisplay(ultima) : ""}
    ${
      r.fechas.length > 1
        ? `<button class="small ver-mas-btn"
            data-fechas='${JSON.stringify(r.fechas)}'>
            Ver más
           </button>`
        : ""
    }
  </div>
`;
     }
    const tr = document.createElement("tr");
    tr.innerHTML = `<td style="text-align:left">${r.titulo}</td><td>${r.veces}</td><td>${fechasHtml}</td>`;
    tbody.appendChild(tr);

  document.getElementById('sortTitulo').textContent = ordenActual.campo==='titulo' ? (ordenActual.sentido==='asc' ? '🔼' : '🔽') : '';
  document.getElementById('sortVeces').textContent = ordenActual.campo==='veces' ? (ordenActual.sentido==='asc' ? '🔼' : '🔽') : '';
  document.getElementById('sortUltima').textContent = ordenActual.campo==='ultima' ? (ordenActual.sentido==='asc' ? '🔼' : '🔽') : '';

/* Fecha helpers */
async function agregarFechaManual(id){
  const fecha = prompt("Introduce la fecha (YYYY-MM-DD):");
  if(!fecha) return;
  const ref = doc(db,"registro",id);
  const snap = await getDoc(ref);
  const data = snap.exists()?snap.data():{veces:0,fechas:[]};
  const nuevas = Array.isArray(data.fechas) ? [...data.fechas, fecha] : [fecha];
  await setDoc(ref, { veces: nuevas.length, fechas: nuevas });
  cargarRegistro();
}
async function borrarFecha(id, idx){
  if(!confirm("Borrar esta fecha?")) return;
  const ref = doc(db,"registro",id);
  const snap = await getDoc(ref);
  if(!snap.exists()) return;
  const data = snap.data();
  const nuevas = Array.isArray(data.fechas) ? data.fechas.filter((_,i)=>i!==idx) : [];
  await setDoc(ref, { veces: nuevas.length, fechas: nuevas });
  cargarRegistro();
}
async function modificarFecha(id, idx, val){
  const ref = doc(db,"registro",id);
  const snap = await getDoc(ref);
  if(!snap.exists()) return;
  const data = snap.data();
  const nuevas = Array.isArray(data.fechas) ? [...data.fechas] : [];
  nuevas[idx] = val;
  await setDoc(ref, { veces: nuevas.length, fechas: nuevas });
  cargarRegistro();
}

/* =========================
  FUNCIONES METRÓNOMO
========================= */

let beatCount = 0; // para acento en el 1 (4/4)
let audioCtx;
let metronomeInterval = null;
let isRunning = false;

let currentBpm =
  Number(localStorage.getItem("metroBpm")) || 80;


/* =====================================================
   ELEMENTOS DEL METRÓNOMO
===================================================== */

const bpmSlider = () =>
  document.getElementById("bpmSlider");

const bpmValue = () =>
  document.getElementById("bpmValue");

const metroBtn = () =>
  document.getElementById("metroToggle");


/* =====================================================
   TAP TEMPO
===================================================== */

let tapTimes = [];
let lastTap = 0;


// Máximo de taps que conservamos
const MAX_TAPS = 6;


// Si pasan más de 2 segundos sin tocar,
// empezamos una nueva medición
const RESET_TIME = 2000;


// Evita dobles registros accidentales.
// 45 ms permite taps bastante rápidos.
const MIN_INTERVAL = 45;


// Número de intervalos recientes utilizados
// para calcular el BPM.
const TAP_INTERVALS_TO_USE = 3;


/* =====================================================
   INICIALIZAR AUDIO
===================================================== */

function initMetronome(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(
    audioCtx.state === "suspended"
  ){

    audioCtx.resume();

  }

}


/* =====================================================
   SONIDO DEL CLICK
===================================================== */

function playClick(){

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();


  const isAccent =
    beatCount === 0;


  // 🌲 Wood click
  osc.type = "triangle";

  osc.frequency.value =
    isAccent
      ? 1200
      : 800;


  const now =
    audioCtx.currentTime;


  gain.gain.setValueAtTime(
    0.0001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    isAccent
      ? 0.6
      : 0.38,

    now + 0.005
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.04
  );


  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  osc.start(now);

  osc.stop(
    now + 0.05
  );


  beatCount =
    (beatCount + 1) % 4;

}


/* =====================================================
   INICIAR METRÓNOMO
===================================================== */

function startMetronome(){

  initMetronome();


  const interval =
    60000 / currentBpm;


  beatCount = 0;


  playClick();


  metronomeInterval =
    setInterval(
      playClick,
      interval
    );


  isRunning = true;


  const button =
    metroBtn();


  if(button){

    button.textContent =
      "⏸ Stop";

  }

}


/* =====================================================
   DETENER METRÓNOMO
===================================================== */

function stopMetronome(){

  clearInterval(
    metronomeInterval
  );


  metronomeInterval = null;


  isRunning = false;


  const button =
    metroBtn();


  if(button){

    button.textContent =
      "▶️ Start";

  }

}


/* =====================================================
   TAP TEMPO
===================================================== */

function tapTempo(){

  initMetronome();


  const now =
    performance.now();


  /* ===================================================
     SI HAN PASADO MÁS DE 2 SEGUNDOS,
     COMENZAMOS UNA NUEVA MEDICIÓN
  =================================================== */

  if(
    lastTap &&
    (now - lastTap) > RESET_TIME
  ){

    tapTimes = [];

  }


  /* ===================================================
     IGNORAR DOBLE TAP ACCIDENTAL
  =================================================== */

  if(
    lastTap &&
    (now - lastTap) < MIN_INTERVAL
  ){

    return;

  }


  /* ===================================================
     REGISTRAR TAP
  =================================================== */

  tapTimes.push(now);

  lastTap = now;


  /* ===================================================
     MANTENER SOLO LOS ÚLTIMOS TAPS
  =================================================== */

  if(
    tapTimes.length > MAX_TAPS
  ){

    tapTimes.shift();

  }


  /* ===================================================
     NECESITAMOS AL MENOS 2 TAPS
  =================================================== */

  if(
    tapTimes.length < 2
  ){

    return;

  }


  /* ===================================================
     CALCULAR INTERVALOS
  =================================================== */

  const intervals = [];


  for(
    let i = 1;
    i < tapTimes.length;
    i++
  ){

    intervals.push(
      tapTimes[i] -
      tapTimes[i - 1]
    );

  }


  /* ===================================================
     USAR SOLO LOS INTERVALOS MÁS RECIENTES

     Esto permite cambiar rápidamente:

     90 → 90 → 90
              ↓
             119
              ↓
             119
              ↓
             119

     sin que los taps antiguos dominen
     el resultado.
  =================================================== */

  const recentIntervals =
    intervals.slice(
      -TAP_INTERVALS_TO_USE
    );


  /* ===================================================
     CALCULAR MEDIA
  =================================================== */

  const averageInterval =
    recentIntervals.reduce(
      (total, interval) =>
        total + interval,
      0
    ) /
    recentIntervals.length;


  /* ===================================================
     CONVERTIR INTERVALO → BPM
  =================================================== */

  const bpm =
    Math.round(
      60000 /
      averageInterval
    );


  /* ===================================================
     COMPROBAR BPM VÁLIDO
  =================================================== */

  if(
    bpm < 40 ||
    bpm > 300
  ){

    return;

  }


  /* ===================================================
     ACTUALIZAR BPM
  =================================================== */

  currentBpm =
    bpm;


  const slider =
    bpmSlider();

  const display =
    bpmValue();


  if(slider){

    slider.value =
      bpm;

  }


  if(display){

    display.textContent =
      bpm;

  }


  /* ===================================================
     GUARDAR BPM
  =================================================== */

  localStorage.setItem(
    "metroBpm",
    bpm
  );


  /* ===================================================
     SI EL METRÓNOMO ESTÁ FUNCIONANDO,
     ACTUALIZAR SU VELOCIDAD
  =================================================== */

  if(isRunning){

    stopMetronome();

    startMetronome();

  }

}

/* =====================================================
   👆 DOBLE TOQUE PARA CERRAR SECCIONES
===================================================== */

function activarDobleToqueCabecera(
  idSeccion,
  funcionCerrar
) {

  const seccion =
    document.getElementById(
      idSeccion
    );

  if (!seccion) return;

  const cabecera =
    seccion.querySelector(
      "h2"
    );

  if (!cabecera) return;

  /* Evitar añadir el listener
     más de una vez */

  if (
    cabecera.dataset.dobleToqueActivo === "true"
  ) {
    return;
  }

  cabecera.dataset.dobleToqueActivo =
    "true";


  let ultimoToque = 0;


  cabecera.addEventListener(
    "pointerup",
    function(event) {

      const ahora =
        performance.now();


      if (
        ahora - ultimoToque >= 80 &&
        ahora - ultimoToque <= 400
      ) {

        if (
          typeof funcionCerrar ===
          "function"
        ) {

          funcionCerrar();

        }

        ultimoToque = 0;

        return;
      }


      ultimoToque = ahora;

    }
  );

}

/* =====================================================
   💾 GUARDAR LISTADO MENSUAL
   Sincroniza el domingo actual con "Canciones para la semana"
===================================================== */

window.guardarListadoMensual = async function(){

  try {

    const mes =
      mesListadoActual
        .toISOString()
        .slice(0, 7);


    /* =================================================
       1️⃣ LEER EL MES QUE YA EXISTE

       Esto es importante porque queremos conservar
       cualquier información que ya exista.
    ================================================= */

    const listadoRef =
      doc(
        db,
        "listado_mensual",
        mes
      );

    const listadoSnap =
      await getDoc(
        listadoRef
      );

    const datosGuardar =
      listadoSnap.exists()
        ? {
            ...listadoSnap.data()
          }
        : {};


    /* =================================================
       2️⃣ RECORRER LOS DOMINGOS EDITABLES
    ================================================= */

    document
      .querySelectorAll(
        ".edit-listado"
      )
      .forEach(
        textarea => {

          const fecha =
            textarea.dataset.fecha;


          const canciones =
            textarea.value
              .split("\n")
              .map(
                s => s.trim()
              )
              .filter(Boolean);


          const select =
            document.querySelector(
              `.cantante-listado[data-fecha="${fecha}"]`
            );


          const cantante =
            select
              ? select.value
              : "";


          /* -------------------------------------------
             Conservar cualquier información previa
             de ese domingo.
          ------------------------------------------- */

          datosGuardar[
            fecha
          ] = {

            ...(
              datosGuardar[
                fecha
              ] || {}
            ),

            canciones,

            cantante

          };

        }
      );


    /* =================================================
       3️⃣ GUARDAR EL MES
    ================================================= */

    await setDoc(
      listadoRef,
      datosGuardar
    );


    /* =================================================
       4️⃣ IDENTIFICAR EL DOMINGO ACTUAL
    ================================================= */

    const domingoActual =
      obtenerDomingoServicioActual();


    /* =================================================
       5️⃣ SOLO SI ESTAMOS GUARDANDO EL MES
          DEL DOMINGO ACTUAL
    ================================================= */

    if (
      mes ===
      obtenerMesDeFecha(
        domingoActual
      )
    ) {

      const infoDomingo =
        datosGuardar[
          domingoActual
        ];


      /*
         Si ese domingo existe en el listado,
         sincronizamos sus canciones y cantante.
      */

      if (infoDomingo) {

        const semanaRef =
          doc(
            db,
            "secciones",
            "semana"
          );


        const semanaSnap =
          await getDoc(
            semanaRef
          );


        const semana =
          semanaSnap.exists()
            ? semanaSnap.data()
            : {};


        /* -------------------------------------------
           ACTUALIZAR SEMANA

           ⚠️ Las NOTAS se conservan exactamente
           como están en secciones/semana.
        ------------------------------------------- */

        await setDoc(
          semanaRef,
          {

            titulo:
              semana.titulo ||
              "Canciones para la semana",

            canciones:
              infoDomingo.canciones ||
              [],

            cantante:
              infoDomingo.cantante ||
              "",

            notas:
              semana.notas ||
              "",

            fechaServicio:
              domingoActual

          }
        );

      }

    }


    /* =================================================
       6️⃣ ACTUALIZAR INTERFAZ
    ================================================= */

    alert(
      "✅ Listado mensual guardado y sincronizado"
    );


    await renderListadoMensual();


    await cargarSeccion(
      "semana"
    );

  }

  catch (error) {

    console.error(
      "❌ Error guardando listado mensual:",
      error
    );

    alert(
      "❌ No se pudo guardar el listado mensual"
    );

  }

};

window.analizarPeriodo = async function(mesesAtras){

  const cont = document.getElementById("resultado-periodo");
  cont.innerHTML = "Analizando...";

  const snap = await getDocs(collection(db,"analisis_mensual"));

  let meses = snap.docs.map(d => d.id).sort().reverse();

  if(mesesAtras > 0){
    meses = meses.slice(0, mesesAtras);
  }

  const acumulado = {
    Excelente: {},
    Bien: {},
    "A mejorar": {}
  };

  for(const mes of meses){
    const data = snap.docs.find(d => d.id === mes)?.data();
    if(!data?.evaluaciones) continue;

    for(const [id, valor] of Object.entries(data.evaluaciones)){
      if(!valor) continue;

      const cancion = cancionesCache.find(c=>c.id===id);
      if(!cancion) continue;

      if(!acumulado[valor][id]){
        acumulado[valor][id] = {
          titulo: cancion.titulo,
          veces: 0,
          cantantes: new Set()
        };
      }

      acumulado[valor][id].veces++;

      if(data.cantantes){
        Object.values(data.cantantes).forEach(c=>{
          if(c) acumulado[valor][id].cantantes.add(c);
        });
      }
    }
  }

  const total =
    Object.keys(acumulado["Excelente"]).length +
    Object.keys(acumulado["Bien"]).length +
    Object.keys(acumulado["A mejorar"]).length;

  window.cacheResultados = acumulado;

  cont.innerHTML = `
    <p>Total evaluadas: <strong>${total}</strong></p>

    <p onclick="mostrarDetallePeriodo('Excelente')" style="cursor:pointer">
      🚀 ${Object.keys(acumulado["Excelente"]).length} fueron excelentes
    </p>

    <p onclick="mostrarDetallePeriodo('Bien')" style="cursor:pointer">
      👍 ${Object.keys(acumulado["Bien"]).length} fueron buenas
    </p>

    <p onclick="mostrarDetallePeriodo('A mejorar')" style="cursor:pointer">
      ‼️ ${Object.keys(acumulado["A mejorar"]).length} necesitan mejorar
    </p>

    <div id="detalle-periodo"></div>
  `;
};

window.mostrarDetallePeriodo = function(tipo){

  const datos = window.cacheResultados[tipo];
  const cont = document.getElementById("detalle-periodo");

  if(!datos || !Object.keys(datos).length){
    cont.innerHTML = "<p>No hay canciones.</p>";
    return;
  }

  const emoji = tipo==="Excelente" ? "🚀"
              : tipo==="Bien" ? "👍"
              : "‼️";

  let html = `<h4 style="margin-top:10px">${emoji} Canciones</h4><ul>`;

  Object.values(datos)
    .sort((a,b)=>b.veces - a.veces)
    .forEach(c=>{
      html += `
        <li>
          <strong>${c.titulo}</strong> (${c.veces})
          <br>
          🎤 ${[...c.cantantes].join(", ") || "-"}
        </li>
      `;
    });

  html += "</ul>";

  cont.innerHTML = html;
};

function renderEstadisticas(rangoMeses, cantanteFiltro){

  contCantante.querySelectorAll(".bloque-cantante").forEach(e=>e.remove());

  const hoy = new Date();

  const listaCantantes = cantanteFiltro === "Todos"
    ? ["Milly","Carolina","Jason"]
    : [cantanteFiltro];

  listaCantantes.forEach(nombre=>{

    const conteo = {
      Excelente: {},
      Bien: {},
      "A mejorar": {}
    };

    let total = 0;

    snapRegistro.forEach(docu=>{
      const data = docu.data();
      const fechas = Array.isArray(data.fechas) ? data.fechas : [];

      fechas.forEach(f => {

        const fechaObj = new Date(f);
        if (isNaN(fechaObj)) return;

        // Solo domingos
        if (fechaObj.getDay() !== 0) return;

        // Filtro rango
        if (rangoMeses > 0) {
          const limite = new Date(
            hoy.getFullYear(),
            hoy.getMonth() - rangoMeses,
            1
          );

          if (fechaObj < limite) return;
        }

        const analisis = analisisGuardado[f];
        if (!analisis) return;
        if (analisis.cantante !== nombre) return;

        const evaluacion = analisis.evaluaciones?.[docu.id];
        if (!evaluacion) return;

        // 🔥 FILTRO CLAVE: ignorar canciones borradas
        const cancion = cancionesCache.find(c => c.id === docu.id);

        // 👉 SI NO EXISTE, SE IGNORA (evita "-")
        if (!cancion || !cancion.titulo) return;

        const titulo = cancion.titulo;

        if (!conteo[evaluacion][titulo]) {
          conteo[evaluacion][titulo] = 0;
        }

        conteo[evaluacion][titulo]++;
        total++;
      });
    });

    // ==============================
    // UI
    // ==============================

    const bloque = document.createElement("div");
    bloque.className = "bloque-cantante";
    bloque.style.marginTop = "20px";
    bloque.style.borderTop = "1px solid #ddd";
    bloque.style.paddingTop = "10px";

    bloque.innerHTML = `
      <h3 style="margin-bottom:10px;">${nombre}</h3>
      <div class="contenido-cantante"></div>
    `;

    const contenido = bloque.querySelector(".contenido-cantante");

    const categorias = [
      { key:"Excelente", emoji:"🚀", color:"#1976d2" },
      { key:"Bien", emoji:"👍", color:"#2e7d32" },
      { key:"A mejorar", emoji:"‼️", color:"#d32f2f" }
    ];

    categorias.forEach(cat=>{

      const canciones = conteo[cat.key];
      const cantidad = Object.values(canciones).reduce((a,b)=>a+b,0);
      const porcentaje = total ? Math.round((cantidad/total)*100) : 0;

      const fila = document.createElement("div");
      fila.style.marginBottom = "12px";

      fila.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-size:14px;">
          <span>${cat.emoji} ${cat.key} (${cantidad})</span>
          <span>${porcentaje}%</span>
        </div>

        <div style="
          background:#b5b5b5;
          height:18px;
          border-radius:10px;
          overflow:hidden;
          cursor:pointer;">
          <div style="
            width:0%;
            background:${cat.color};
            height:100%;
            transition: width 0.5s ease-out;">
          </div>
        </div>

        <div style="display:none; margin-top:6px; font-size:13px;"></div>
      `;

      const barra = fila.querySelector("div:nth-child(2) > div");
      const porcentajeSpan = fila.querySelector("span:last-child");

      setTimeout(() => {
        barra.style.width = porcentaje + "%";
      }, 50);

      let valorActual = 0;
      const incremento = Math.ceil(porcentaje / 20);

      const intervalo = setInterval(() => {
        valorActual += incremento;

        if (valorActual >= porcentaje) {
          valorActual = porcentaje;
          clearInterval(intervalo);
        }

        porcentajeSpan.textContent = valorActual + "%";
      }, 25);

      const listaDiv = fila.lastElementChild;

      barra.parentElement.addEventListener("click",()=>{
        listaDiv.style.display =
          listaDiv.style.display === "block" ? "none" : "block";
      });

      const listaOrdenada = Object.entries(canciones)
        .sort((a,b)=>b[1]-a[1])
        .map(([titulo, veces])=>`• ${titulo} (${veces})`)
        .join("<br>");

      listaDiv.innerHTML = listaOrdenada || "Sin datos";

      contenido.appendChild(fila);
    });

    contCantante.appendChild(bloque);
  });
}

/* Mostrar / ocultar Worship Pack (tarjetas de las canciones listadas en la sección) */
async function mostrarWorshipPack(tipo) {
  const cont = document.getElementById(`worshippack-${tipo}`);
  const boton = document.querySelector(
    `button[onclick="mostrarWorshipPack('${tipo}')"]`
  );
  if (!cont || !boton) return;

  // Toggle
  if (cont.style.display === "block") {
    cont.style.display = "none";
    cont.innerHTML = "";
    boton.textContent = "🎁 Worship Pack";
    return;
  }

  const snap = await getDoc(doc(db, "secciones", tipo));
  if (!snap.exists()) {
    cont.innerHTML = "<p>No hay canciones guardadas.</p>";
    cont.style.display = "block";
    boton.textContent = "🔽 Ocultar pack";
    return;
  }

  const data = snap.data();
  cont.innerHTML = "";

  // 🔑 CLAVE: recorrer en el orden escrito
  data.canciones.forEach(tituloSemana => {
    const cancion = cancionesCache.find(
      c => normalizar(c.titulo) === normalizar(tituloSemana)
    );

    if (cancion) {
      cont.appendChild(construirCard(cancion));
    }
  });

  if (!cont.innerHTML) {
    cont.innerHTML =
      "<p>⚠️ Ninguna de las canciones coincide con el repertorio.</p>";
  }

  cont.style.display = "block";
  boton.textContent = "🔽 Ocultar pack";
}

/* =====================================================
   🎼 ABRIR LETRA + ACORDES

   MODO NORMAL  → VISOR
   MODO EDICIÓN → EDITOR
===================================================== */

function abrirLetraAcordes(id) {

  const modal =
    document.getElementById(
      "modal-letra-acordes"
    );

  if (!modal) return;


  const cancion =
    cancionesCache.find(
      c => c.id === id
    );


  if (!cancion) {

    console.warn(
      "No se encontró la canción:",
      id
    );

    return;

  }


  /* =================================================
     GUARDAR CANCIÓN SELECCIONADA
  ================================================= */

  window.cancionLetraAcordes =
    cancion;


  /* =================================================
     TÍTULO
  ================================================= */

  const titulo =
    document.getElementById(
      "letra-acordes-titulo"
    );


  if (titulo) {

    titulo.textContent =
      `🎼 ${cancion.titulo || "Canción"}`;

  }


  /* =================================================
     TONO INICIAL
  ================================================= */

  const tono =
    document.getElementById(
      "la-tono-actual"
    );


  if (tono) {

    const tonoInicial =
      cancion.letraAcordes?.tonoOriginal ||
      cancion.acordes ||
      "-";


    tono.textContent =
      tonoInicial;

  }


  /* =================================================

  ================================================= */

  const editor =
    document.getElementById(
      "la-editor-container"
    );


  const visor =
    document.getElementById(
      "la-visor-container"
    );


  const controlesEditor =
    document.getElementById(
      "la-controles-editor"
    );


  if (!editor || !visor) {

    console.warn(
      "No se encontraron los contenedores del editor/visor."
    );

    return;

  }


  /* =================================================
     MODO EDICIÓN
  ================================================= */

  if (modoEdicion) {

    /* Crear/cargar editor */

    crearEditorLetraAcordes();


    editor.style.display =

    visor.style.display =
      "none";


    /* Mostrar controles de edición */

    if (controlesEditor) {

      controlesEditor.style.display =
        "flex";

  /* =================================================

  else {

    crearVisorLetraAcordes();

    botonVer.style.display =
      "none";

  }


  /* =================================================

  ================================================= */

  modal.style.display =
    "flex";

function crearEditorLetraAcordes() {

  const contenedor =
    document.getElementById(
      "la-editor-container"
    );

  if (!contenedor) return;


  contenedor.innerHTML = "";


  const cancion =
    window.cancionLetraAcordes;


  /* =================================================
     SI EXISTEN DATOS GUARDADOS
  ================================================= */

  if (
    cancion &&
    cancion.letraAcordes &&
    Array.isArray(
      cancion.letraAcordes.secciones
    ) &&
    cancion.letraAcordes.secciones.length > 0
  ) {

    cancion.letraAcordes.secciones
      .forEach(
        datosSeccion => {

          crearSeccionEditor(
            contenedor,
            datosSeccion

    return;

  /* =================================================
     SI NO EXISTEN DATOS → CREAR EDITOR VACÍO
  ================================================= */

  crearSeccionEditor(
    contenedor
  );

/* =====================================================
   🎼 TRANSPOSICIÓN DE ACORDES
   PASO 5
===================================================== */

const NOTAS_TRANSPOSICION = [
  "C",
  "C#",
  "D",
  "D#",
  "E",
  "F",
  "F#",
  "G",
  "G#",
  "A",
  "A#",
  "B"
];


/* =====================================================
   CONVERTIR bemoles → sostenidos
===================================================== */

function normalizarNota(nota) {

  const equivalencias = {
    "Db": "C#",
    "Eb": "D#",
    "Gb": "F#",
    "Ab": "G#",
    "Bb": "A#"
  };

  return equivalencias[nota] || nota;
}


/* =====================================================
   TRANSPONER UNA NOTA
===================================================== */

function transponerNota(
  nota,
  pasos
) {

  const normalizada =
    normalizarNota(nota);

  const indice =
    NOTAS_TRANSPOSICION.indexOf(
      normalizada
    );

  if (indice === -1) {
    return nota;
  }

  const nuevoIndice =
    (
      indice +
      pasos +
      NOTAS_TRANSPOSICION.length
    ) %
    NOTAS_TRANSPOSICION.length;

  return NOTAS_TRANSPOSICION[
    nuevoIndice
  ];
}


/* =====================================================
   TRANSPONER UN ACORDE
   Ejemplos:

   A       → A#
   F#m     → F#m
   E/G#    → F/A
   D/F#    → D#/G
   C#m7    → Dm7
===================================================== */

function transponerAcorde(
  acorde,
  pasos
) {

  if (!acorde) {
    return acorde;
  }


  const match =
    acorde.match(
      /^([A-G](?:#|b)?)(.*)$/
    );


  if (!match) {
    return acorde;
  }


  const nota =
    match[1];

  let resto =
    match[2];


  /* Transponer nota principal */

  const nuevaNota =
    transponerNota(
      nota,
      pasos
    );


  /* =================================================
     ACORDE CON BAJO

     E/G#
     D/F#
     C/E
  ================================================= */

  resto =
    resto.replace(
      /^\/([A-G](?:#|b)?)/,
      function(_, bajo) {

        return (
          "/" +
          transponerNota(
            bajo,
            pasos
          )
        );

      }
    );


  return (
    nuevaNota +
    resto
  );

}


/* =====================================================
   TRANSPONER UNA LÍNEA COMPLETA DE ACORDES
   Conserva exactamente los espacios originales
===================================================== */

function transponerLineaAcordes(
  texto,
  pasos
) {

  if (!texto) {
    return texto;
  }


  /*
     Solo sustituimos los acordes.
     Todos los espacios, tabulaciones y
     posiciones originales permanecen intactos.
  */

  return texto.replace(
    /\S+/g,
    function(acorde) {

      return transponerAcorde(
        acorde,
        pasos
      );

    }
  );

}


/* =====================================================
   TRANSPONER TODO EL EDITOR
===================================================== */

function transponerEditor(
  pasos
) {

  const inputs =
    document.querySelectorAll(
      ".la-acordes-linea"
    );


  const visor =
  document.getElementById(
    "la-visor-container"
  );

const editor =
  document.getElementById(
    "la-editor-container"
  );


/* =================================================
   MODO EDITOR
================================================= */

if (
  editor &&
  editor.style.display !== "none"
) {

  const inputs =
    editor.querySelectorAll(
      ".la-acordes-linea"
    );


  inputs.forEach(
    input => {

      input.value =
        transponerLineaAcordes(
          input.value,
          pasos
        );

    }
  );

}


/* =================================================
   MODO VISOR
================================================= */

if (
  visor &&
  visor.style.display === "block"
) {

  const acordesVisor =
    visor.querySelectorAll(
      ".la-acorde-visor"
    );


  acordesVisor.forEach(
    acorde => {

      acorde.textContent =
        transponerLineaAcordes(
          acorde.textContent,
          pasos
        );

    }
  );

}

  /* Actualizar Key */

  const tono =
    document.getElementById(
      "la-tono-actual"
    );

  if (!tono) {
    return;
  }


  const notaActual =
    normalizarNota(
      tono.textContent
        .replace(
          "Key:",
          ""
        )
        .trim()
    );


  const nuevaNota =
    transponerNota(
      notaActual,
      pasos
    );


  tono.textContent =
    nuevaNota;

}

/* =====================================================
   💾 GUARDAR LETRA + ACORDES
===================================================== */

async function guardarLetraAcordes() {

  const cancion =
    window.cancionLetraAcordes;

  if (!cancion || !cancion.id) {

    alert("❌ No se ha seleccionado ninguna canción.");

    return;

  }


  const secciones = [];


  document
    .querySelectorAll(".la-seccion-editor")
    .forEach(seccion => {

      const nombreInput =
        seccion.querySelector(
          ".la-seccion-nombre"
        );

      const nombre =
        nombreInput
          ? nombreInput.value.trim()
          : "";


      const lineas = [];


      seccion
        .querySelectorAll(".la-linea-editor")
        .forEach(fila => {

          const acordesInput =
            fila.querySelector(
              ".la-acordes-linea"
            );

          const letraInput =
            fila.querySelector(
              ".la-letra-linea"
            );


const acordes =
  acordesInput
    ? acordesInput.value
    : "";

const letra =
  letraInput
    ? letraInput.value
    : "";


          /*
             No guardamos líneas completamente vacías
          */

          if (acordes || letra) {

            lineas.push({
              acordes,
              letra
            });

          }

        });


      /*
         Solo guardar secciones que tengan
         nombre o contenido
      */

      if (
        nombre ||
        lineas.length > 0
      ) {

        secciones.push({
          nombre,
          lineas
        });

      }

    });


  const tono =
    document
      .getElementById(
        "la-tono-actual"
      )
      ?.textContent
      .trim() || "";


  const letraAcordes = {

    tonoOriginal:
      cancion.letraAcordes?.tonoOriginal ||
      tono,

    secciones

  };


  try {

    await updateDoc(
      doc(
        db,
        "canciones",
        cancion.id
      ),
      {
        letraAcordes
      }
    );


    /*
       Actualizar la canción en memoria
       para que no tengamos que recargar
       toda la página
    */

    cancion.letraAcordes =
      letraAcordes;


    const indice =
      cancionesCache.findIndex(
        c => c.id === cancion.id
      );


    if (indice !== -1) {

      cancionesCache[indice].letraAcordes =
        letraAcordes;

    }


    alert(
      "✅ Letra y acordes guardados"
    );


  } catch (error) {

    console.error(
      "Error guardando letra y acordes:",
      error
    );


    alert(
      "❌ No se pudo guardar la letra y los acordes."
    );

  }

}
